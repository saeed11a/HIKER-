# Base44 sandbox runbook for HIKER+ Shoes Factory ERP.
#
# Runs the Vite dev server straight from the cloned source (bind mount + startup
# install) so every edit shows up live in the preview on host port 3000.
#
# The app is a Base44 frontend: its data/auth backend is a hosted service, so no
# local database service is declared here. Supabase (the target backend) is a
# managed service reached over the network, not a compose service.
#
# `docker compose -f docker-compose.base44.yml up -d --build`
services:
  web:
    # Plain runtime image, never a prebuilt app image: the repo is bind-mounted
    # and the dev server runs from source so edits are live.
    image: node:22-bookworm
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      # Dependencies live in a volume (not the bind mount) and are (re)installed
      # from the mounted manifests on every start, honouring the committed
      # package-lock.json.
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this value to `server.allowedHosts`, which is what
      # lets the preview proxy host (<port>-<sandbox id>.e2b.app) reach the dev
      # server. Passed through bare so the platform-provided value is used.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      # Sandbox-only: lets the preview wear the Windows EXE's desktop shell so the
      # theme can be looked at without building the installer (see
      # `src/lib/desktopShell.js`). Derived from the platform flag, never hardcoded —
      # empty everywhere else, so `import.meta.env.VITE_BASE44_PREVIEW_MODE` is not
      # '1' and every real build keeps the behaviour it had. Remove with the code.
      - VITE_BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
    env_file:
      # Public, non-secret defaults first; platform-managed secrets second, so a
      # value configured in the dashboard always wins over the default. The
      # app-wide unlock PIN (VITE_APP_PIN) is a user-supplied secret and arrives
      # this way — it is deliberately absent from the committed defaults file.
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      # Vite is exec'd from the local install rather than through `npx`: the
      # npx/npm wrapper reports every container stop as "npm error signal
      # SIGTERM" even on a clean restart, which is noise, not an app failure.
      - npm install --no-audit --no-fund && exec ./node_modules/.bin/vite --host 0.0.0.0 --port 3000 --strictPort
    # Probes real app responsiveness (index.html served by Vite), with a long
    # grace period for the first dependency install.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # Read-only file server for the installers built in this sandbox. `release/`
  # is gitignored, so the built APK/EXE can be downloaded without being copied
  # into the app bundle (anything under public/ ends up in dist/, and therefore
  # inside the next APK/EXE). The preview proxy serves it on host port 8000 at
  # https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/.
  downloads:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./release:/usr/share/nginx/html:ro
      - ./docker/apk-server.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot database tool for the Supabase project. Not started by `up`
  # (profile "tools"); invoke it explicitly, e.g.
  #   docker compose -f docker-compose.base44.yml run --rm dbadmin \
  #     sh -c 'psql "$SUPABASE_DB_URL" -f /sql/migrations/0001_core_schema.sql'
  # Compose parses the managed secrets file (which quotes values containing special
  # characters) correctly, so the connection string arrives intact here.
  dbadmin:
    image: postgres:16
    profiles: ["tools"]
    restart: "no"
    working_dir: /sql
    volumes:
      - ./supabase:/sql:ro
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    # One-shot tool: no default server. Override with
    #   docker compose run --rm dbadmin sh -c 'psql "$SUPABASE_DB_URL" -f ...'
    command: ["echo", "dbadmin is a one-shot tool — see docker-compose.base44.yml"]

volumes:
  web_node_modules:
